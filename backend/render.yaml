services:
  - type: web
    name: algoverse-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: AlgoVerse API
